<?xml version="1.0" encoding="UTF-8"?>
<!-- Filigree corner ornament — port of Game HUD/filigree.jsx FiligreeCorner (level='maximal').
     60×60. Anchored at (0,0) top-left; the "inside" of a panel sits at (60,60).
     USS rotates this single source via `scale: -1 1`, `scale: 1 -1`, `scale: -1 -1`
     for the other three corners (.tw-corner-tr / -bl / -br). -->
<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#cfd6d3" stroke-width="1.4" stroke-linecap="round">
        <!-- Big outer scroll -->
        <path d="M 2 30 Q 2 2 30 2" />
        <!-- Mid arc (dim silver) -->
        <path d="M 8 30 Q 8 8 30 8" stroke="#7f8e8a" stroke-width="0.98" />
        <!-- Inner curl that turns back on itself -->
        <path d="M 30 2 Q 18 14 26 22 Q 32 28 22 30" />
        <path d="M 2 30 Q 14 18 22 26 Q 28 32 30 22" />
        <!-- Spurs -->
        <line x1="30" y1="2" x2="30" y2="6" />
        <line x1="2" y1="30" x2="6" y2="30" />
        <!-- Floret -->
        <circle cx="14" cy="14" r="1.6" fill="#e8b84a" stroke="none" />
        <path d="M 11 17 Q 14 14 17 11" stroke="#7f8e8a" stroke-width="0.84" />
        <path d="M 7 23 Q 9 21 11 21" />
        <path d="M 23 7 Q 21 9 21 11" />
        <!-- Terminal studs -->
        <circle cx="22" cy="30" r="1.1" fill="#e8b84a" stroke="none" />
        <circle cx="30" cy="22" r="1.1" fill="#e8b84a" stroke="none" />
    </g>
</svg>
