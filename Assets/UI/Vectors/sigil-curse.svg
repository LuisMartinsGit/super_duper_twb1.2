<?xml version="1.0" encoding="UTF-8"?>
<!-- Curse-node sigil: ringed dot with radial ticks. Port of ObjectiveIcon('curse')
     from Game HUD/index.html. 22×22 with content centered at (11,11). -->
<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(11,11)">
        <circle r="7" fill="none" stroke="#e8b84a" stroke-width="1.3" />
        <circle r="3.5" fill="none" stroke="#020806" stroke-width="0.9" />
        <circle r="1.4" fill="#e8b84a" />
        <g stroke="#e8b84a" stroke-width="1.3" stroke-linecap="round">
            <line x1="0" y1="-10" x2="0" y2="-8" />
            <line x1="0" y1="10"  x2="0" y2="8" />
            <line x1="-10" y1="0" x2="-8" y2="0" />
            <line x1="10" y1="0"  x2="8" y2="0" />
        </g>
    </g>
</svg>
