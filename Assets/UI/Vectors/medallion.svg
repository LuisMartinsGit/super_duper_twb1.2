<?xml version="1.0" encoding="UTF-8"?>
<!-- Diamond medallion with jade gem and radiating spurs — port of FiligreeMedallion.
     60×60. Used at each tip of the minimap frame and for ornamental anchors. -->
<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="medGem" cx="50%" cy="40%" r="60%">
            <stop offset="0%"  stop-color="#3fbf9a" stop-opacity="1" />
            <stop offset="60%" stop-color="#1d6a55" stop-opacity="1" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
        </radialGradient>
    </defs>
    <g fill="none" stroke="#cfd6d3" stroke-width="1.4" stroke-linecap="round">
        <!-- Outer diamond -->
        <path d="M 30 4 L 50 30 L 30 56 L 10 30 Z" />
        <!-- Inner gem -->
        <path d="M 30 12 L 42 30 L 30 48 L 18 30 Z" fill="url(#medGem)" />
        <!-- Gem facets -->
        <path d="M 30 12 L 30 48" stroke="#3fbf9a" stroke-width="0.7" opacity="0.6" />
        <path d="M 18 30 L 42 30" stroke="#3fbf9a" stroke-width="0.7" opacity="0.6" />
        <!-- Radiating spurs -->
        <line x1="30" y1="0"  x2="30" y2="3"  stroke="#e8b84a" />
        <line x1="30" y1="57" x2="30" y2="60" stroke="#e8b84a" />
        <line x1="0"  y1="30" x2="3"  y2="30" stroke="#e8b84a" />
        <line x1="57" y1="30" x2="60" y2="30" stroke="#e8b84a" />
        <!-- Dim flourishes -->
        <path d="M 30 4 Q 22 10 18 14" stroke="#7f8e8a" stroke-width="0.98" />
        <path d="M 30 4 Q 38 10 42 14" stroke="#7f8e8a" stroke-width="0.98" />
        <path d="M 30 56 Q 22 50 18 46" stroke="#7f8e8a" stroke-width="0.98" />
        <path d="M 30 56 Q 38 50 42 46" stroke="#7f8e8a" stroke-width="0.98" />
    </g>
</svg>
