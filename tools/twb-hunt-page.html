<title>Desync Hunt Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ── tokens ──────────────────────────────────────────────────────────────
   Neutrals carry a violet bias, borrowed from the veil the game is named
   for; the accent is that same violet at full strength. Semantic colour
   (agree / fork / warn) is deliberately separate from the accent so a red
   row means "this forked" and never "this is highlighted".
   Faction hues are the ones tools/batch-dashboard.py already uses, so a
   Blue line means Blue everywhere in the toolchain.                        */
:root{
  --paper:#f5f4fa; --panel:#fffffe; --panel2:#edebf5; --sunk:#e4e1ef;
  --line:#dcd8ea; --line2:#c8c3dc;
  --ink:#191824; --ink2:#585470; --ink3:#8a85a2;
  --veil:#5a49ea; --veil-soft:#e9e6fe; --veil-line:#c4bcfb;
  --agree:#1b8a5e; --agree-soft:#dcf1e8;
  --fork:#c9342a; --fork-soft:#fbe3e1;
  --warn:#a76f12; --warn-soft:#faeed6;
  --f-Blue:#3f7fd8; --f-Red:#c94f47; --f-Green:#31936a; --f-Yellow:#a9821f;
  --f-Purple:#8a52c4; --f-Orange:#c46a24; --f-Teal:#1f8f92; --f-White:#6f6b84;
  --grid:#e7e4f1;
  --shadow:0 1px 2px rgba(25,24,36,.06), 0 8px 24px -18px rgba(25,24,36,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d0c13; --panel:#16151e; --panel2:#1e1c29; --sunk:#121119;
    --line:#2a2739; --line2:#3a3650;
    --ink:#eeecf6; --ink2:#a8a3bd; --ink3:#6f6a87;
    --veil:#8f80fc; --veil-soft:#211d38; --veil-line:#463c78;
    --agree:#43c68d; --agree-soft:#12301f;
    --fork:#f4675c; --fork-soft:#361513;
    --warn:#e2a744; --warn-soft:#302209;
    --f-Blue:#6ba3ee; --f-Red:#e2756c; --f-Green:#58c495; --f-Yellow:#dbae4d;
    --f-Purple:#ab7ce4; --f-Orange:#e08c45; --f-Teal:#3fb4b7; --f-White:#a6a1bd;
    --grid:#221f2f;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -20px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#0d0c13; --panel:#16151e; --panel2:#1e1c29; --sunk:#121119;
  --line:#2a2739; --line2:#3a3650;
  --ink:#eeecf6; --ink2:#a8a3bd; --ink3:#6f6a87;
  --veil:#8f80fc; --veil-soft:#211d38; --veil-line:#463c78;
  --agree:#43c68d; --agree-soft:#12301f;
  --fork:#f4675c; --fork-soft:#361513;
  --warn:#e2a744; --warn-soft:#302209;
  --f-Blue:#6ba3ee; --f-Red:#e2756c; --f-Green:#58c495; --f-Yellow:#dbae4d;
  --f-Purple:#ab7ce4; --f-Orange:#e08c45; --f-Teal:#3fb4b7; --f-White:#a6a1bd;
  --grid:#221f2f;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -20px #000;
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:Archivo,"Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.45; margin:0;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
      font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--veil); outline-offset:2px; border-radius:4px}

.eyebrow{
  font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink3);
}

/* ── shell ─────────────────────────────────────────────────────────────── */
.shell{display:grid; grid-template-columns:336px minmax(0,1fr);
       grid-template-rows:auto minmax(0,1fr); min-height:100vh}
.topbar{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center;
        gap:22px; padding:14px 22px; background:var(--panel);
        border-bottom:1px solid var(--line)}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:6px}
.brand h1{font-size:16px; font-weight:700; letter-spacing:-.01em}
.brand .sub{font-size:11px; color:var(--ink3)}

.stat{display:flex; flex-direction:column; gap:1px; min-width:70px}
.stat .v{font-size:19px; font-weight:600; line-height:1.1}
.stat .k{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3)}
.stat.good .v{color:var(--agree)} .stat.bad .v{color:var(--fork)}

.pulse{margin-left:auto; display:flex; align-items:center; gap:9px;
       font-size:11px; color:var(--ink2)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--agree);
     box-shadow:0 0 0 3px var(--agree-soft)}
@media (prefers-reduced-motion:no-preference){
  .dot{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
}

/* ── ledger ────────────────────────────────────────────────────────────── */
.ledger{border-right:1px solid var(--line); background:var(--panel);
        display:flex; flex-direction:column; min-height:0}
.ledger-head{padding:13px 16px 9px; display:flex; align-items:baseline;
             justify-content:space-between; gap:8px}
.ledger-list{overflow-y:auto; padding:0 8px 14px; display:flex;
             flex-direction:column; gap:3px}

/* Every run is one row: a severity stripe, what it was, and how far it got.
   The stripe is the whole point of the list -- a fork has to read from the
   far side of the room. */
.run{display:grid; grid-template-columns:4px 1fr auto; gap:0 11px;
     align-items:center; padding:9px 11px 9px 0; border-radius:7px;
     background:transparent; border:1px solid transparent; cursor:pointer;
     text-align:left; width:100%}
.run:hover{background:var(--panel2)}
.run[aria-current="true"]{background:var(--veil-soft); border-color:var(--veil-line)}
.run .stripe{align-self:stretch; border-radius:3px; background:var(--agree);
             margin:1px 0 1px 7px}
.run.fork .stripe{background:var(--fork)}
.run.unknown .stripe{background:var(--line2)}
.run .who{min-width:0}
.run .map{font-weight:600; font-size:13px; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis}
.run .meta{font-size:11px; color:var(--ink3); white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis}
.run .right{text-align:right; font-size:11px; color:var(--ink2)}
.run .verdict{font-weight:600; font-size:11px; letter-spacing:.04em}
.run.fork .verdict{color:var(--fork)}
.run.ok .verdict{color:var(--agree)}

/* ── stage ─────────────────────────────────────────────────────────────── */
.stage{min-width:0; display:flex; flex-direction:column; gap:16px;
       padding:18px 22px 40px; overflow-y:auto}
.headline{display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px}
.headline h2{font-size:22px; font-weight:700; letter-spacing:-.015em}
.headline .when{font-size:12px; color:var(--ink3)}

.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px;
      border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.03em;
      border:1px solid}
.chip.ok{color:var(--agree); background:var(--agree-soft); border-color:transparent}
.chip.fork{color:var(--fork); background:var(--fork-soft); border-color:transparent}
.chip.flat{color:var(--ink2); background:var(--panel2); border-color:var(--line)}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line)}
.tab{appearance:none; background:none; border:0; padding:9px 14px 10px;
     font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--ink3);
     cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--veil)}

.panel{background:var(--panel); border:1px solid var(--line);
       border-radius:10px; box-shadow:var(--shadow)}
.panel-head{display:flex; align-items:baseline; justify-content:space-between;
            gap:12px; padding:12px 15px 0}
.panel-head h3{font-size:13px; font-weight:600}
.panel-head .note{font-size:11px; color:var(--ink3)}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}

/* ── replay ────────────────────────────────────────────────────────────── */
.replay{display:grid; grid-template-columns:minmax(0,1fr) 214px; gap:0}
@media (max-width:940px){ .replay{grid-template-columns:1fr} }
.mapwrap{position:relative; background:var(--sunk);
         border-radius:10px 0 0 10px; overflow:hidden}
@media (max-width:940px){ .mapwrap{border-radius:10px 10px 0 0} }
#map{display:block; width:100%; height:100%; min-height:420px}
.maptime{position:absolute; left:12px; top:11px; font-size:11px;
         color:var(--ink2); background:var(--panel); border:1px solid var(--line);
         border-radius:6px; padding:3px 8px}
.legend{border-left:1px solid var(--line); padding:13px 14px;
        display:flex; flex-direction:column; gap:11px}
@media (max-width:940px){ .legend{border-left:0; border-top:1px solid var(--line)} }
.legrow{display:flex; align-items:center; gap:8px; font-size:12px}
.swatch{width:9px; height:9px; border-radius:50%; flex:none}
.swatch.sq{border-radius:2px; width:8px; height:8px}
.legrow .n{margin-left:auto; color:var(--ink3); font-size:11px}

.transport{display:flex; align-items:center; gap:10px; padding:11px 15px;
           border-top:1px solid var(--line)}
.tbtn{appearance:none; border:1px solid var(--line2); background:var(--panel2);
      border-radius:7px; padding:5px 11px; font-size:12px; font-weight:600;
      cursor:pointer; min-width:62px}
.tbtn:hover{border-color:var(--veil); color:var(--veil)}
.speeds{display:flex; gap:3px}
.speed{appearance:none; border:1px solid transparent; background:none;
       border-radius:6px; padding:4px 8px; font-size:11px; font-weight:600;
       color:var(--ink3); cursor:pointer}
.speed[aria-pressed="true"]{background:var(--veil-soft); color:var(--veil);
                            border-color:var(--veil-line)}
input[type=range]{flex:1; min-width:80px; accent-color:var(--veil)}

/* ── data bits ─────────────────────────────────────────────────────────── */
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12px;
    padding:12px 15px 15px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}

table{border-collapse:collapse; width:100%; font-size:12px}
th{text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
   color:var(--ink3); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:7px 10px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.scroll{overflow-x:auto}

.bars{display:flex; flex-direction:column; gap:6px; padding:12px 15px 15px}
.bar{display:grid; grid-template-columns:132px 1fr auto; gap:9px; align-items:center;
     font-size:12px}
.bar .track{height:7px; border-radius:4px; background:var(--panel2); overflow:hidden}
.bar .fill{height:100%; border-radius:4px; background:var(--veil)}
.bar .c{color:var(--ink3); font-size:11px; min-width:22px; text-align:right}

.tl{padding:4px 15px 14px; display:flex; flex-direction:column; gap:0;
    max-height:270px; overflow-y:auto}
.tl .ev{display:grid; grid-template-columns:52px 74px 1fr; gap:10px;
        font-size:12px; padding:5px 0; border-bottom:1px solid var(--line)}
.tl .ev:last-child{border-bottom:0}
.tl .t{color:var(--ink3)}
.tl .cat{font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase}
.tl .msg{color:var(--ink2); overflow-wrap:anywhere}

canvas.chart{display:block; width:100%; height:150px}
.chartbox{padding:6px 10px 12px}

.empty{padding:60px 20px; text-align:center; color:var(--ink3)}
.foot{padding:6px 2px 0; font-size:11px; color:var(--ink3)}
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Desync Hunt Console</h1>
      <span class="sub">The Waning Border &middot; lockstep determinism watch</span>
    </div>
    <div class="stat"><span class="v mono" id="s-matches">0</span><span class="k">matches all time</span></div>
    <div class="stat"><span class="v mono" id="s-peers">0</span><span class="k">lockstep matches</span></div>
    <div class="stat good"><span class="v mono" id="s-clean">0</span><span class="k">agreed</span></div>
    <div class="stat bad"><span class="v mono" id="s-forks">0</span><span class="k">forked</span></div>
    <div class="stat"><span class="v mono" id="s-ticks">0</span><span class="k">tick rows compared</span></div>
    <div class="stat"><span class="v mono" id="s-simhours">0</span><span class="k">sim hours run</span></div>
    <div class="pulse"><span class="dot"></span><span id="s-gen">&mdash;</span></div>
  </header>

  <aside class="ledger">
    <div class="ledger-head">
      <span class="eyebrow">Run ledger</span>
      <span class="eyebrow" id="ledger-count"></span>
    </div>
    <div class="ledger-list" id="ledger"></div>
  </aside>

  <main class="stage" id="stage"></main>
</div>

<script type="application/json" id="hunt-data">/*__TWB_DATA__*/</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("hunt-data").textContent);
var MATCHES = DATA.matches || [];
var FACTIONS = ["Blue","Red","Green","Yellow","Purple","Orange","Teal","White"];

/* Checksum column -> what a fork in it means. The dump prints the short
   name; a reader three weeks from now should not have to go and look it up. */
var COLDESC = {
  pos:"transforms", rot:"facing", hp:"health", nav:"destination / flow / steering",
  cbt:"combat target + cooldown", wrk:"construction / mining", bank:"faction resources",
  tech:"research, queues, sects, hero XP", rng:"seeded RNG streams",
  veil:"veil field + territory", cost:"nav cost field"
};

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fhue(f){ var v = css("--f-"+f); return v || css("--ink3"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function mmss(t){ t=Math.max(0,Math.round(t)); var m=Math.floor(t/60);
  return m+":"+String(t%60).padStart(2,"0"); }
function stampLabel(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/.exec(s||"");
  return m ? (m[3]+"/"+m[2]+" "+m[4]+":"+m[5]) : (s||"");
}
function forked(r){ var d=r.desync||{}; return !!(d.flagged || d.forkTick!=null); }
function checked(r){ var d=r.desync||{}; return (d.compared||0) > 0; }

/* ── header ─────────────────────────────────────────────────────────── */
/* All-time, not this-window. Match folders are pruned off disk as the hunt
   runs, so counting only what the page carries meant the fork total fell back
   to zero a few hours after finding something. DATA.totals comes from the
   append-only history file. */
function renderTop(){
  var T = DATA.totals || {};
  var mp = MATCHES.filter(function(r){ return r.kind==="mp"; });
  document.getElementById("s-matches").textContent = T.runs != null ? T.runs : MATCHES.length;
  document.getElementById("s-peers").textContent   = T.mp != null ? T.mp : mp.length;
  document.getElementById("s-clean").textContent   = (T.mp||0) - (T.forks||0);
  document.getElementById("s-forks").textContent   = T.forks || 0;
  document.getElementById("s-ticks").textContent   = (T.compared||0).toLocaleString();
  document.getElementById("s-simhours").textContent = ((T.simSeconds||0)/3600).toFixed(1);
  document.getElementById("s-gen").textContent = "updated " + (DATA.generated||"?") + " · every 5 min";
  document.getElementById("ledger-count").textContent =
    MATCHES.length + " in detail" + (T.runs > MATCHES.length ? " of " + T.runs : "");
}

/* ── ledger ─────────────────────────────────────────────────────────── */
var selected = 0;
function renderLedger(){
  var host = document.getElementById("ledger");
  host.textContent = "";
  if(!MATCHES.length){
    var e=document.createElement("div"); e.className="empty";
    e.textContent="No match folders found yet."; host.appendChild(e); return;
  }
  MATCHES.forEach(function(r,i){
    var b = document.createElement("button");
    b.type="button"; b.className="run " + (forked(r) ? "fork" : checked(r) ? "ok" : "unknown");
    b.setAttribute("aria-current", i===selected ? "true" : "false");
    var d = r.desync||{};
    var verdict = forked(r) ? ("FORK t"+(d.forkTick!=null?d.forkTick:d.flagTick))
                : checked(r) ? "agreed"
                : (r.kind==="mp" ? "no data" : "solo");
    b.innerHTML =
      '<span class="stripe"></span>' +
      '<span class="who">' +
        '<span class="map">'+esc(r.map)+'</span>' +
        '<span class="meta mono">'+stampLabel(r.stamp)+' · '+
          (r.kind==="mp" ? (r.peers+" peers") : "1 peer")+
          (r.tmax ? " · "+mmss(r.tmax) : "")+'</span>' +
      '</span>' +
      '<span class="right"><span class="verdict">'+esc(verdict)+'</span><br>' +
        '<span class="mono">'+((d.ticks||0).toLocaleString())+'t</span></span>';
    b.addEventListener("click", function(){ selected=i; renderLedger(); renderStage(); });
    host.appendChild(b);
  });

  /* Forks whose match folder has since been pruned. The detail is gone, but
     the finding is not, and a hunt that quietly forgets what it found is
     worse than one that never ran. */
  var pruned = DATA.pruned || [];
  if(pruned.length){
    var hd = document.createElement("div");
    hd.className = "eyebrow";
    hd.style.cssText = "padding:14px 8px 5px";
    hd.textContent = "Earlier forks · evidence pruned";
    host.appendChild(hd);
    pruned.forEach(function(r){
      var row = document.createElement("div");
      row.className = "run fork";
      row.style.cursor = "default";
      row.innerHTML =
        '<span class="stripe"></span>' +
        '<span class="who"><span class="map">'+esc(r.map)+'</span>' +
        '<span class="meta mono">'+stampLabel(r.stamp)+' · '+r.peers+' peers'+
          (r.forkCols&&r.forkCols.length ? ' · '+esc(r.forkCols.join(", ")) : '')+
        '</span></span>' +
        '<span class="right"><span class="verdict">FORK'+
          (r.forkTick!=null ? " t"+r.forkTick : "")+'</span><br>' +
          '<span class="mono" style="color:var(--ink3)">logs gone</span></span>';
      host.appendChild(row);
    });
  }
}

/* ── charts ─────────────────────────────────────────────────────────── */
function fitCanvas(cv, h){
  var r = window.devicePixelRatio||1, w = cv.clientWidth||600;
  cv.width = Math.round(w*r); cv.height = Math.round(h*r);
  cv.style.height = h+"px";
  var g = cv.getContext("2d"); g.setTransform(r,0,0,r,0,0);
  return g;
}
/* One scale places marks, ticks and labels. Every y label names a value the
   series actually reaches, so the axis never promises headroom that is not
   in the data. */
function lineChart(cv, series, opts){
  opts = opts||{};
  var H = opts.height||150, g = fitCanvas(cv,H), W = cv.clientWidth||600;
  var padL=42, padR=10, padT=10, padB=20;
  var iw = Math.max(10, W-padL-padR), ih = Math.max(10, H-padT-padB);
  var xs=[], ys=[];
  series.forEach(function(s){ s.pts.forEach(function(p){ xs.push(p[0]); ys.push(p[1]); }); });
  g.clearRect(0,0,W,H);
  if(!xs.length){
    g.fillStyle=css("--ink3"); g.font='11px "IBM Plex Mono",monospace';
    g.fillText("no samples", padL, padT+14); return;
  }
  var x0=0, x1=Math.max.apply(null,xs)||1;
  var y1=Math.max.apply(null,ys); if(!(y1>0)) y1=1;
  var y0=Math.min(0, Math.min.apply(null,ys));
  var nice = Math.pow(10, Math.floor(Math.log10(y1)));
  y1 = Math.ceil(y1/nice)*nice;
  var X=function(v){ return padL + (v-x0)/(x1-x0||1)*iw; };
  var Y=function(v){ return padT + ih - (v-y0)/((y1-y0)||1)*ih; };

  g.strokeStyle=css("--grid"); g.lineWidth=1;
  g.fillStyle=css("--ink3"); g.font='10px "IBM Plex Mono",monospace';
  g.textBaseline="middle";
  [y0,(y0+y1)/2,y1].forEach(function(v){
    var y=Math.round(Y(v))+0.5;
    g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke();
    g.textAlign="right"; g.fillText(fmtNum(v), padL-6, y);
  });
  g.textAlign="center"; g.textBaseline="top";
  [0,0.5,1].forEach(function(f){
    var t=x0+(x1-x0)*f; g.fillText(mmss(t), X(t), padT+ih+5);
  });

  series.forEach(function(s){
    if(!s.pts.length) return;
    g.strokeStyle=s.color; g.lineWidth=s.width||1.75;
    g.lineJoin="round"; g.beginPath();
    s.pts.forEach(function(p,i){ var x=X(p[0]), y=Y(p[1]); i?g.lineTo(x,y):g.moveTo(x,y); });
    g.stroke();
    var last=s.pts[s.pts.length-1];
    g.fillStyle=s.color; g.beginPath();
    g.arc(X(last[0]), Y(last[1]), 2.6, 0, Math.PI*2); g.fill();
  });
}
function fmtNum(v){
  v = Math.round(v);
  if(Math.abs(v)>=10000) return (v/1000).toFixed(0)+"k";
  return String(v);
}

/* ── replay ─────────────────────────────────────────────────────────── */
var R = { t:0, playing:false, speed:8, last:0, raf:0, match:null };

function drawMap(){
  var m = R.match; if(!m) return;
  var cv = document.getElementById("map"); if(!cv) return;
  var H = Math.max(420, cv.clientHeight||420);
  var g = fitCanvas(cv, H), W = cv.clientWidth||600;
  var ex = m.extent||[-100,-100,100,100];
  var spanX = Math.max(1, ex[2]-ex[0]), spanZ = Math.max(1, ex[3]-ex[1]);
  var pad = 16;
  var k = Math.min((W-pad*2)/spanX, (H-pad*2)/spanZ);
  var offX = (W - spanX*k)/2, offZ = (H - spanZ*k)/2;
  var PX = function(x){ return offX + (x-ex[0])*k; };
  /* Z grows north in the sim; screen y grows down. Flip, or every replay
     plays out mirrored against the minimap the tester remembers. */
  var PZ = function(z){ return offZ + (ex[3]-z)*k; };

  g.clearRect(0,0,W,H);
  g.fillStyle = css("--sunk"); g.fillRect(0,0,W,H);

  /* 100 m grid: the map is authored on a 2 m build grid, so a 100 m rule is
     the scale a reader can actually count in. */
  g.strokeStyle = css("--grid"); g.lineWidth = 1;
  var step = spanX > 600 ? 200 : 100;
  for(var gx=Math.ceil(ex[0]/step)*step; gx<=ex[2]; gx+=step){
    g.beginPath(); g.moveTo(Math.round(PX(gx))+0.5, 0);
    g.lineTo(Math.round(PX(gx))+0.5, H); g.stroke();
  }
  for(var gz=Math.ceil(ex[1]/step)*step; gz<=ex[3]; gz+=step){
    g.beginPath(); g.moveTo(0, Math.round(PZ(gz))+0.5);
    g.lineTo(W, Math.round(PZ(gz))+0.5); g.stroke();
  }

  var t = R.t;

  /* Buildings that exist at t: add/remove events replayed in order. */
  var live = {};
  (m.builds||[]).forEach(function(b){
    if(b.t > t) return;
    var id = b.f+"|"+b.id+"|"+b.x+"|"+b.z;
    if(b.e === "add") live[id] = b; else delete live[id];
  });
  Object.keys(live).forEach(function(id){
    var b = live[id];
    var big = /Fortress|Hall|Keep|Temple|Court/i.test(b.id);
    var s = big ? 11 : 7;
    g.fillStyle = fhue(b.f) || css("--ink3");
    g.globalAlpha = .9;
    g.fillRect(PX(b.x)-s/2, PZ(b.z)-s/2, s, s);
    g.globalAlpha = 1;
    g.strokeStyle = css("--panel"); g.lineWidth = 1;
    g.strokeRect(PX(b.x)-s/2, PZ(b.z)-s/2, s, s);
  });

  /* Units: interpolate between the two nearest position frames so a 15 s
     sample cadence still reads as movement rather than teleporting. */
  var fr = m.replay||[];
  if(fr.length){
    var i = 0; while(i < fr.length-1 && fr[i+1].t <= t) i++;
    var a = fr[i], b = fr[Math.min(i+1, fr.length-1)];
    var span = (b.t - a.t) || 1;
    var f = Math.max(0, Math.min(1, (t - a.t)/span));
    Object.keys(a.u).forEach(function(fa){
      var pa = a.u[fa]||[], pb = (b.u&&b.u[fa])||[];
      g.fillStyle = fhue(fa) || css("--ink3");
      for(var n=0;n<pa.length;n++){
        /* Units are unlabelled dots, so pairing by index is as good as the
           data allows and reads correctly in aggregate. */
        var q = pb[n] || pa[n];
        var x = pa[n][0] + (q[0]-pa[n][0])*f;
        var z = pa[n][1] + (q[1]-pa[n][1])*f;
        g.beginPath(); g.arc(PX(x), PZ(z), 2.4, 0, Math.PI*2); g.fill();
      }
    });
  }

  /* Deaths flash for 12 s of match time: where the fighting was. */
  (m.deaths||[]).forEach(function(d){
    var age = t - d.t; if(age < 0 || age > 12) return;
    var r = 3 + age*1.6, al = 1 - age/12;
    g.strokeStyle = fhue(d.v) || css("--fork");
    g.globalAlpha = al*0.85; g.lineWidth = 1.6;
    g.beginPath(); g.arc(PX(d.x), PZ(d.z), r, 0, Math.PI*2); g.stroke();
    g.globalAlpha = 1;
  });

  /* The fork, if there was one, on the tick it happened. */
  var ds = m.desync||{};
  var forkT = ds.forkTick!=null ? ds.forkTick/30 : null;
  if(forkT!=null && t >= forkT){
    g.fillStyle = css("--fork");
    g.font='600 11px Archivo,sans-serif'; g.textAlign="left"; g.textBaseline="top";
    g.fillText("fork at tick "+ds.forkTick+" ("+mmss(forkT)+")", 12, H-24);
  }

  var lab = document.getElementById("maptime");
  if(lab) lab.textContent = mmss(t) + " / " + mmss(m.tmax||0)
                          + "  · tick " + Math.round(t*30);
}

function tick(ts){
  if(!R.playing){ R.raf=0; return; }
  var dt = R.last ? (ts-R.last)/1000 : 0; R.last = ts;
  R.t += dt * R.speed;
  var end = (R.match && R.match.tmax) || 0;
  if(R.t >= end){ R.t = end; setPlaying(false); }
  var sc = document.getElementById("scrub"); if(sc) sc.value = String(R.t);
  drawMap();
  R.raf = requestAnimationFrame(tick);
}
function setPlaying(p){
  R.playing = p; R.last = 0;
  var b = document.getElementById("playbtn");
  if(b) b.textContent = p ? "Pause" : (R.t >= ((R.match&&R.match.tmax)||0) ? "Replay" : "Play");
  if(p && !R.raf) R.raf = requestAnimationFrame(tick);
}

/* ── stage ──────────────────────────────────────────────────────────── */
var TAB = "replay";
function renderStage(){
  var host = document.getElementById("stage");
  host.textContent = "";
  var m = MATCHES[selected];
  if(!m){
    host.innerHTML = '<div class="panel"><div class="empty">'+
      'Nothing to show yet. The batch writes a match folder when its first sample lands.'+
      '</div></div>';
    return;
  }
  var keepT = (R.match && R.match.key === m.key) ? R.t : 0;
  R.match = m; R.t = keepT; setPlaying(false);

  var ds = m.desync||{};
  var head = document.createElement("div");
  head.className = "headline";
  head.innerHTML =
    '<h2>'+esc(m.map)+'</h2>' +
    '<span class="when mono">'+esc(m.stamp)+' · '+
      (m.kind==="mp" ? m.peers+" peers, lockstep" : "single process")+
      ' · '+esc(m.build)+'</span>' +
    (forked(m)
      ? '<span class="chip fork">forked at tick '+(ds.forkTick!=null?ds.forkTick:ds.flagTick)+'</span>'
      : checked(m)
        ? '<span class="chip ok">'+(ds.compared||0).toLocaleString()+' tick rows agreed</span>'
        : '<span class="chip flat">not cross-checked</span>') +
    (m.exceptions ? '<span class="chip fork">'+m.exceptions+' exception(s)</span>' : "");
  host.appendChild(head);

  var tabs = document.createElement("div");
  tabs.className = "tabs";
  [["replay","Map replay"],["econ","Economy"],["brains","AI brains"],
   ["sync","Determinism"],["cover","Coverage"]]
    .forEach(function(p){
      var b=document.createElement("button");
      b.type="button"; b.className="tab"; b.textContent=p[1];
      b.setAttribute("aria-selected", TAB===p[0] ? "true":"false");
      b.addEventListener("click", function(){ TAB=p[0]; renderStage(); });
      tabs.appendChild(b);
    });
  host.appendChild(tabs);

  var body = document.createElement("div");
  body.style.display="flex"; body.style.flexDirection="column"; body.style.gap="14px";
  host.appendChild(body);

  if(TAB==="replay")      buildReplay(body, m);
  else if(TAB==="econ")   buildEcon(body, m);
  else if(TAB==="brains") buildBrains(body, m);
  else if(TAB==="cover")  buildCoverage(body);
  else                    buildSync(body, m);

  var foot=document.createElement("p");
  foot.className="foot";
  foot.textContent = "Source: " + m.key + " · "
    + (m.replay||[]).length + " position frames, "
    + (m.builds||[]).length + " building events, "
    + (m.deaths||[]).length + " deaths.";
  host.appendChild(foot);
}

function buildReplay(host, m){
  var p = document.createElement("div");
  p.className = "panel";
  var counts = {};
  (m.replay||[]).forEach(function(fr){
    Object.keys(fr.u).forEach(function(f){
      counts[f] = Math.max(counts[f]||0, fr.u[f].length); });
  });
  var legend = FACTIONS.filter(function(f){ return counts[f]; }).map(function(f){
    return '<div class="legrow"><span class="swatch" style="background:'+fhue(f)+'"></span>'+
           f+'<span class="n mono">peak '+counts[f]+'</span></div>'; }).join("");
  p.innerHTML =
    '<div class="replay">' +
      '<div class="mapwrap"><canvas id="map"></canvas>' +
        '<div class="maptime mono" id="maptime"></div></div>' +
      '<div class="legend">' +
        '<span class="eyebrow">Forces</span>' + legend +
        '<span class="eyebrow" style="margin-top:6px">Marks</span>' +
        '<div class="legrow"><span class="swatch" style="background:var(--ink3)"></span>unit</div>' +
        '<div class="legrow"><span class="swatch sq" style="background:var(--ink3)"></span>building</div>' +
        '<div class="legrow"><span class="swatch" style="background:transparent;'+
          'border:1.5px solid var(--fork)"></span>death, 12 s</div>' +
        '<div class="legrow" style="color:var(--ink3);font-size:11px;margin-top:4px">'+
          'Grid rule 100 m. Positions sampled every 15 s and interpolated.</div>' +
      '</div>' +
    '</div>' +
    '<div class="transport">' +
      '<button class="tbtn" id="playbtn" type="button">Play</button>' +
      '<input type="range" id="scrub" min="0" max="'+(m.tmax||0)+'" step="1" value="0" aria-label="Match time">' +
      '<div class="speeds" role="group" aria-label="Playback speed">' +
        [1,4,8,30,120].map(function(s){
          return '<button class="speed" type="button" data-s="'+s+'" aria-pressed="'+
                 (R.speed===s)+'">'+s+'&times;</button>'; }).join("") +
      '</div>' +
    '</div>';
  host.appendChild(p);

  document.getElementById("playbtn").addEventListener("click", function(){
    if(R.t >= (m.tmax||0)) R.t = 0;
    setPlaying(!R.playing);
  });
  var sc = document.getElementById("scrub");
  sc.value = String(R.t);
  sc.addEventListener("input", function(e){
    R.t = Number(e.target.value); drawMap();
  });
  Array.prototype.forEach.call(p.querySelectorAll(".speed"), function(b){
    b.addEventListener("click", function(){
      R.speed = Number(b.dataset.s);
      Array.prototype.forEach.call(p.querySelectorAll(".speed"), function(o){
        o.setAttribute("aria-pressed", String(Number(o.dataset.s)===R.speed)); });
    });
  });
  requestAnimationFrame(function(){ drawMap(); });
}

function seriesFor(m, key){
  return Object.keys(m.series||{}).map(function(f){
    return { color: fhue(f) || "#888", name: f,
             pts: m.series[f].map(function(r){ return [r.t, r[key]||0]; }) };
  });
}
function chartPanel(host, title, note, series){
  var p = document.createElement("div");
  p.className = "panel";
  p.innerHTML = '<div class="panel-head"><h3>'+esc(title)+'</h3>'+
                '<span class="note">'+esc(note)+'</span></div>'+
                '<div class="chartbox"><canvas class="chart"></canvas></div>';
  host.appendChild(p);
  requestAnimationFrame(function(){ lineChart(p.querySelector("canvas"), series); });
  return p;
}

function buildEcon(host, m){
  var g = document.createElement("div"); g.className="grid2"; host.appendChild(g);
  chartPanel(g, "Supplies", "banked, per faction", seriesFor(m,"s"));
  chartPanel(g, "Iron", "banked, per faction", seriesFor(m,"i"));
  chartPanel(g, "Veilstone", "banked — only the curse precipitates it", seriesFor(m,"v"));
  chartPanel(g, "Army", "live units", seriesFor(m,"units"));
  chartPanel(g, "Buildings", "standing", seriesFor(m,"bld"));
  chartPanel(g, "Territories", "regions held", seriesFor(m,"terr"));

  /* THE MAP'S OWN SHORTFALL, before any of the above is blamed on a brain.
     Resources are authored-only now, so nothing is seeded at runtime to hide
     a territory with no supply nodes in it. */
  var au = m.audit || [];
  if(au.length){
    var ap = document.createElement("div"); ap.className="panel";
    var warns = au.filter(function(r){ return r.sev==="warn"; }).length;
    ap.innerHTML = '<div class="panel-head"><h3>Map audit</h3>'+
      '<span class="note">'+(warns ? warns+" territor"+(warns===1?"y":"ies")+
        " below the Regions.md quota" : "every territory at quota")+'</span></div>'+
      '<div class="tl" style="max-height:210px">'+au.map(function(r){
        return '<div class="ev" style="grid-template-columns:118px 1fr">'+
          '<span class="cat" style="color:'+(r.sev==="warn"?"var(--warn)":"var(--ink3)")+
          '">'+esc(r.src==="SupplyNodeBootstrap"?"supply":"ore / veilstone")+'</span>'+
          '<span class="msg">'+esc(r.text)+'</span></div>'; }).join("")+'</div>';
    host.appendChild(ap);
  }

  /* Final standing, because a chart of six lines does not answer "who won
     the economy" at a glance. */
  var rows = Object.keys(m.series||{}).map(function(f){
    var s = m.series[f]; var last = s[s.length-1]||{};
    return {f:f, last:last};
  });
  var p = document.createElement("div"); p.className="panel";
  p.innerHTML = '<div class="panel-head"><h3>Where each faction finished</h3>'+
    '<span class="note">last sample, t+'+mmss(m.tmax||0)+'</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Faction</th>'+
    '<th class="num">Supplies</th><th class="num">Iron</th><th class="num">Veilstone</th>'+
    '<th class="num">Pop</th><th class="num">Units</th><th class="num">Buildings</th>'+
    '<th class="num">Territories</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td><span class="swatch" style="display:inline-block;background:'+
        fhue(r.f)+';margin-right:7px"></span>'+r.f+'</td>'+
        ['s','i','v'].map(function(k){ return '<td class="num mono">'+(r.last[k]||0)+'</td>'; }).join("")+
        '<td class="num mono">'+(r.last.pop||0)+'/'+(r.last.popMax||0)+'</td>'+
        '<td class="num mono">'+(r.last.units||0)+'</td>'+
        '<td class="num mono">'+(r.last.bld||0)+'</td>'+
        '<td class="num mono">'+(r.last.terr||0)+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  host.appendChild(p);
}

function buildBrains(host, m){
  var ai = m.ai||{};
  var names = Object.keys(ai);
  if(!names.length){
    var e=document.createElement("div"); e.className="panel";
    e.innerHTML='<div class="empty">No AI log for this match. '+
      'A run whose AI logs are near-empty is the vacuous-match signature — '+
      'check that the brains reached the match world.</div>';
    host.appendChild(e); return;
  }

  /* Wallets first: the AI spends out of three wallets and refuses whatever
     the relevant one cannot cover, so "what did it refuse" is unreadable
     without "what was in the wallet". */
  var g1 = document.createElement("div"); g1.className="grid2"; host.appendChild(g1);
  ["mil","eco","adv"].forEach(function(cat,ci){
    chartPanel(g1,
      {mil:"Military wallet",eco:"Economy wallet",adv:"Advancement wallet"}[cat],
      "supplies held, per faction",
      names.map(function(f){
        return { color: fhue(f),
                 pts: ai[f].budget.map(function(b){ return [b.t, b[cat][0]]; }) };
      }));
  });
  chartPanel(g1, "Income", "supplies per second, smoothed", names.map(function(f){
    return { color: fhue(f), pts: ai[f].budget.map(function(b){ return [b.t, b.emaS]; }) };
  }));
  chartPanel(g1, "Known enemy strength", "what intel believes it is facing",
    names.map(function(f){
      return { color: fhue(f), pts: ai[f].intel.map(function(x){ return [x.t, x.strength]; }) };
    }));
  chartPanel(g1, "Enemy sightings", "remembered contacts", names.map(function(f){
    return { color: fhue(f), pts: ai[f].intel.map(function(x){ return [x.t, x.sightings]; }) };
  }));

  /* ORDERS ON THE WIRE, not orders the brain believed it gave. The router
     can refuse what the brain logged, so this is the independent account.
     Keyed by lockstep player index: p0 is the host, and in this harness the
     host carries every faction's brain while the clients issue only the
     monkey and chaos traffic. */
  var ord = (m.orders && m.orders.series) || [];
  if(ord.length){
    var pids = [];
    ord.forEach(function(row){ Object.keys(row.by).forEach(function(k){
      if(pids.indexOf(k)<0) pids.push(k); }); });
    pids.sort();
    var PC = ["--f-Blue","--f-Red","--f-Green","--f-Yellow"];
    chartPanel(g1, "Orders on the wire", "commands per 15 s, by lockstep peer",
      pids.map(function(pid,i){
        return { color: css(PC[i % PC.length]),
                 pts: ord.map(function(row){ return [row.t, row.by[pid]||0]; }) };
      }));
  }

  /* Weights: what the brain WANTED to spend on, next to what it could. */
  /* THE JOIN THAT MATTERS. "wallet short" is the most common thing the brain
     ever says, and on its own it reads as poverty. Put the bank beside it and
     it reads as something else entirely: the AI is starved of SUPPLIES while
     sitting on iron it cannot spend, and a territory claim costs both. The
     iron:supplies column is the deadlock in one number. */
  var wp = document.createElement("div"); wp.className="panel";
  wp.innerHTML = '<div class="panel-head"><h3>Budget split and what it could not buy</h3>'+
    '<span class="note">final weights, income, and the bank behind them</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Faction</th><th class="num">Adv</th>'+
    '<th class="num">Mil</th><th class="num">Eco</th><th class="num">Supplies/s</th>'+
    '<th class="num">Iron/s</th><th class="num">Bank s</th><th class="num">Bank i</th>'+
    '<th class="num">i : s</th><th class="num">Terr</th>'+
    '<th class="num">Short</th><th class="num">Orders</th><th>Last plan</th>'+
    '</tr></thead><tbody>'+
    names.map(function(f){
      var b = ai[f].budget[ai[f].budget.length-1] || {w:[0,0,0],emaS:0,emaI:0};
      var plan = ai[f].plan[ai[f].plan.length-1];
      var orders = Object.keys(ai[f].cmds).reduce(function(a,k){ return a+ai[f].cmds[k]; },0);
      var ser = (m.series||{})[f] || [];
      var last = ser[ser.length-1] || {s:0,i:0,terr:0};
      var ratio = last.s > 0 ? (last.i/last.s) : (last.i > 0 ? Infinity : 0);
      var shortCount = (ai[f].refusals||{})["wallet short"] || 0;
      var hot = ratio >= 10;
      return '<tr><td><span class="swatch" style="display:inline-block;background:'+
        fhue(f)+';margin-right:7px"></span>'+f+'</td>'+
        b.w.map(function(x){ return '<td class="num mono">'+(x*100).toFixed(0)+'%</td>'; }).join("")+
        '<td class="num mono">'+b.emaS.toFixed(1)+'</td>'+
        '<td class="num mono">'+b.emaI.toFixed(1)+'</td>'+
        '<td class="num mono">'+last.s+'</td>'+
        '<td class="num mono">'+last.i+'</td>'+
        '<td class="num mono" style="color:'+(hot?"var(--warn)":"var(--ink2)")+'">'+
          (ratio===Infinity ? "&infin;" : ratio.toFixed(1))+'</td>'+
        '<td class="num mono">'+last.terr+'</td>'+
        '<td class="num mono">'+shortCount+'</td>'+
        '<td class="num mono">'+orders+'</td>'+
        '<td style="color:var(--ink2)">'+esc(plan?plan.text:"—")+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<p class="foot" style="padding:2px 15px 13px">A high iron-to-supplies '+
    'ratio next to a high refusal count is the expansion deadlock: a '+
    'territory claim costs supplies and iron, the supply side never reaches '+
    'the threshold, so territory income never grows to fund the next claim.</p>';
  host.appendChild(wp);

  /* Why it did not buy. This is the single most diagnostic AI number in the
     log and no tool surfaced it. */
  var g2 = document.createElement("div"); g2.className="grid3"; host.appendChild(g2);
  names.forEach(function(f){
    var refs = ai[f].refusals||{};
    var keys = Object.keys(refs).sort(function(a,b){ return refs[b]-refs[a]; }).slice(0,7);
    var max = keys.length ? refs[keys[0]] : 1;
    var p = document.createElement("div"); p.className="panel";
    p.innerHTML = '<div class="panel-head"><h3><span class="swatch" '+
      'style="display:inline-block;background:'+fhue(f)+';margin-right:7px"></span>'+
      f+' refusals</h3></div>'+
      (keys.length
        ? '<div class="bars">'+keys.map(function(k){
            return '<div class="bar"><span>'+esc(k)+'</span>'+
              '<span class="track"><span class="fill" style="width:'+
              Math.round(refs[k]/max*100)+'%;background:'+fhue(f)+'"></span></span>'+
              '<span class="c mono">'+refs[k]+'</span></div>'; }).join("")+'</div>'
        : '<div class="empty" style="padding:20px">bought everything it wanted</div>');
    g2.appendChild(p);
  });

  /* The brain's own narration, merged across factions and ordered by time. */
  var evs = [];
  names.forEach(function(f){
    ["posture","plan","claim","research"].forEach(function(cat){
      (ai[f][cat]||[]).forEach(function(e){
        evs.push({t:e.t, f:f, cat:cat, text:e.text}); });
    });
  });
  evs.sort(function(a,b){ return a.t-b.t; });
  var tp = document.createElement("div"); tp.className="panel";
  tp.innerHTML = '<div class="panel-head"><h3>Decision log</h3>'+
    '<span class="note">'+evs.length+' posture, plan, claim and research events</span></div>'+
    '<div class="tl">'+ (evs.length ? evs.map(function(e){
      return '<div class="ev"><span class="t mono">'+mmss(e.t)+'</span>'+
        '<span class="cat" style="color:'+fhue(e.f)+'">'+e.f+' '+e.cat+'</span>'+
        '<span class="msg">'+esc(e.text)+'</span></div>'; }).join("")
      : '<div class="empty" style="padding:20px">nothing logged</div>') + '</div>';
  host.appendChild(tp);
}

function buildSync(host, m){
  var ds = m.desync||{};
  var p = document.createElement("div"); p.className="panel";
  p.innerHTML = '<div class="panel-head"><h3>Cross-peer agreement</h3>'+
    '<span class="note">'+(m.kind==="mp" ? m.peers+" peers" : "single process, nothing to compare")+
    '</span></div>'+
    '<dl class="kv">'+
      '<dt>SYNC flag</dt><dd>'+(ds.flagged
        ? '<span class="chip fork">desync raised at tick '+ds.flagTick+'</span>'
        : '<span class="chip ok">never raised</span>')+'</dd>'+
      '<dt>Per-tick diff</dt><dd>'+(ds.forkTick!=null
        ? '<span class="chip fork">first differing tick '+ds.forkTick+'</span>'
        : ds.compared
          ? '<span class="chip ok">'+ds.compared.toLocaleString()+' rows identical</span>'
          : '<span class="chip flat">not compared</span>')+'</dd>'+
      '<dt>Ticks recorded</dt><dd class="mono">'+(ds.ticks||0).toLocaleString()+'</dd>'+
      '<dt>Forked columns</dt><dd>'+(ds.forkCols&&ds.forkCols.length
        ? ds.forkCols.map(function(c){
            var k=c.toLowerCase();
            return '<span class="chip fork" style="margin-right:5px">'+esc(c)+
              (COLDESC[k]?' · '+esc(COLDESC[k]):"")+'</span>'; }).join("")
        : '<span style="color:var(--ink3)">none</span>')+'</dd>'+
      '<dt>Dumps on disk</dt><dd class="mono">'+(ds.dumps&&ds.dumps.length
        ? esc(ds.dumps.slice(0,6).join(", ")) : "—")+'</dd>'+
      '<dt>Outcome</dt><dd>'+esc(m.outcome)+' after '+esc(m.duration)+'</dd>'+
      '<dt>Console</dt><dd class="mono">'+m.errors+' errors, '+m.warnings+
        ' warnings, '+m.exceptions+' exceptions</dd>'+
      /* A starved peer can be dropped as lost, and a match that ended for
         that reason is not a clean run. Gameplay frames only; boot is
         always enormous and says nothing. */
      '<dt>Held real time</dt><dd class="mono">'+
        (m.realtime
          ? ('&times;'+m.realtime.toFixed(2)+' of wall clock'+
             (m.realtime > 1.5 ? ' — peers were starved' :
              m.realtime > 1.1 ? ' — behind, but never dropped' : ' — kept up'))
          : 'not measurable')+'</dd>'+
      '<dt>Frame spikes</dt><dd class="mono">'+
        (m.perf ? (m.perf.spikes+' past the log threshold, worst '+
                   m.perf.worst+' ms, '+m.perf.over500+' over 500 ms')
                : 'not recorded')+'</dd>'+
    '</dl>';
  host.appendChild(p);

  var kinds = (m.orders && m.orders.kinds) || {};
  var kk = Object.keys(kinds).sort(function(a,b){ return kinds[b]-kinds[a]; });
  if(kk.length){
    var kmax = kinds[kk[0]];
    var kp = document.createElement("div"); kp.className="panel";
    kp.innerHTML = '<div class="panel-head"><h3>Command coverage</h3>'+
      '<span class="note">every order type this match put on the wire</span></div>'+
      '<div class="bars">'+kk.map(function(k){
        return '<div class="bar"><span class="mono">'+esc(k)+'</span>'+
          '<span class="track"><span class="fill" style="width:'+
          Math.round(kinds[k]/kmax*100)+'%"></span></span>'+
          '<span class="c mono">'+kinds[k]+'</span></div>'; }).join("")+'</div>';
    host.appendChild(kp);
  }

  var near = (m.orders && m.orders.near) || [];
  if(near.length){
    var np = document.createElement("div"); np.className="panel";
    np.innerHTML = '<div class="panel-head"><h3>Orders around the fork</h3>'+
      '<span class="note">four seconds before to one after</span></div>'+
      '<div class="tl" style="max-height:320px">'+near.map(function(l){
        return '<div class="ev" style="grid-template-columns:1fr">'+
               '<span class="msg mono">'+esc(l)+'</span></div>'; }).join("")+
      '</div>';
    host.appendChild(np);
  }

  var note = document.createElement("div"); note.className="panel";
  note.innerHTML = '<div class="panel-head"><h3>What the checksum covers</h3>'+
    '<span class="note">deterministic mode</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Column</th><th>State</th>'+
    '</tr></thead><tbody>'+
    Object.keys(COLDESC).map(function(k){
      return '<tr><td class="mono">'+k+'</td><td style="color:var(--ink2)">'+
             esc(COLDESC[k])+'</td></tr>'; }).join("")+
    '</tbody></table></div>';
  host.appendChild(note);
}

/* ── coverage ───────────────────────────────────────────────────────── */
/* Not per match: this is the whole hunt. A run report that only says what
   passed invites the reading that everything is fine, when the honest answer
   is usually "we have not looked there yet". Cells are counted over the full
   history, so a combination stays covered after its logs are pruned. */
function buildCoverage(host){
  var cov = DATA.coverage || [];
  var T = DATA.totals || {};
  var p = document.createElement("div"); p.className="panel";
  if(!cov.length){
    p.innerHTML = '<div class="empty">No lockstep runs recorded yet.</div>';
    host.appendChild(p); return;
  }
  var maps = [], ages = [];
  cov.forEach(function(c){
    if(maps.indexOf(c.map)<0) maps.push(c.map);
    if(ages.indexOf(c.age)<0) ages.push(c.age);
  });
  maps.sort(); ages.sort();
  var maxRuns = cov.reduce(function(a,c){ return Math.max(a,c.runs); },1);

  function cell(map, age, warm, monkey){
    return cov.filter(function(c){
      return c.map===map && c.age===age && c.warm===warm && c.monkey===monkey;
    })[0];
  }
  /* The last column is not a configuration, it is an admission: runs made
     before the harness logged what it was testing. Dropping them would show
     an empty matrix over hundreds of real matches, which is a worse lie than
     saying "we do not know what these were". */
  var axes = [["0","0","fresh · chaos"],["1","0","warm · chaos"],
              ["0","1","fresh · monkey"],["1","1","warm · monkey"],
              ["?","?","not recorded"]];

  var rows = "";
  maps.forEach(function(map){
    ages.forEach(function(age){
      rows += '<tr><td><strong>'+esc(map)+'</strong></td>'+
              '<td class="mono">Age '+esc(age)+'</td>';
      axes.forEach(function(a){
        var c = cell(map, age, a[0], a[1]);
        if(!c){
          rows += '<td class="num" style="color:var(--ink3)">&mdash;</td>';
        } else {
          var w = Math.round(c.runs/maxRuns*100);
          rows += '<td class="num"><span class="mono" style="color:'+
            (c.forks ? "var(--fork)" : "var(--ink)")+'">'+c.runs+
            (c.forks ? " · "+c.forks+" fork" : "")+'</span>'+
            '<div class="track" style="height:4px;margin-top:4px;border-radius:3px;'+
            'background:var(--panel2);overflow:hidden"><div style="height:100%;width:'+
            w+'%;background:'+(c.forks?"var(--fork)":"var(--agree)")+'"></div></div></td>';
        }
      });
      rows += '</tr>';
    });
  });

  p.innerHTML = '<div class="panel-head"><h3>What the hunt has tried</h3>'+
    '<span class="note">'+(T.mp||0)+' lockstep matches over '+
    ((T.simSeconds||0)/3600).toFixed(1)+' simulated hours</span></div>'+
    '<div class="scroll"><table><thead><tr><th>Map</th><th>Start</th>'+
    axes.map(function(a){ return '<th class="num">'+a[2]+'</th>'; }).join("")+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="foot" style="padding:2px 15px 13px">A dash is a combination '+
    'nobody has run. Bar length is runs relative to the busiest cell. '+
    'Runs from before the harness logged its own configuration land in the '+
    'last column.</p>';
  host.appendChild(p);

  /* Which columns have ever been seen to fork, across the whole history.
     Two entries today, both from before the checksum was widened. */
  var forks = (DATA.pruned||[]).concat(
    MATCHES.filter(forked).map(function(r){
      var d=r.desync||{};
      return {stamp:r.stamp, map:r.map, peers:r.peers,
              forkTick:(d.forkTick!=null?d.forkTick:d.flagTick),
              forkCols:d.forkCols||[]};
    }));
  var fp = document.createElement("div"); fp.className="panel";
  fp.innerHTML = '<div class="panel-head"><h3>Every fork on record</h3>'+
    '<span class="note">'+forks.length+' since the history file opened</span></div>'+
    (forks.length
      ? '<div class="scroll"><table><thead><tr><th>When</th><th>Map</th>'+
        '<th class="num">Peers</th><th class="num">Tick</th><th>Columns</th>'+
        '</tr></thead><tbody>'+forks.map(function(r){
          return '<tr><td class="mono">'+esc(r.stamp)+'</td><td>'+esc(r.map)+
            '</td><td class="num mono">'+r.peers+'</td><td class="num mono">'+
            (r.forkTick!=null?r.forkTick:"?")+'</td><td>'+
            (r.forkCols||[]).map(function(c){
              return '<span class="chip fork" style="margin-right:4px">'+esc(c)+'</span>';
            }).join("")+'</td></tr>';
        }).join("")+'</tbody></table></div>'
      : '<div class="empty" style="padding:24px">No fork has been recorded.</div>');
  host.appendChild(fp);
}

/* ── boot ───────────────────────────────────────────────────────────── */
renderTop(); renderLedger(); renderStage();

var redraw = null;
window.addEventListener("resize", function(){
  clearTimeout(redraw);
  redraw = setTimeout(function(){ renderStage(); }, 160);
});
if(window.matchMedia){
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change", function(){ renderStage(); });
}
})();
</script>
