name = "twb-updates"
main = "src/index.js"
compatibility_date = "2026-08-18"

# Per-tester keys. Revoking a tester is a single `wrangler kv key delete`,
# no redeploy.
#
# A key's value says which EDITIONS it may download (src/index.js parseGrant):
#   demo key (edition A only) - a bare name, as every key before editions:
#     wrangler kv key put --binding KEYS "key:<KEY>" "<tester>"
#   developer key (B and/or C as well):
#     wrangler kv key put --binding KEYS "key:<KEY>" '{"name":"<tester>","editions":["A","B","C"]}'
#   revoke:
#     wrangler kv key delete --binding KEYS "key:<KEY>"
[[kv_namespaces]]
binding = "KEYS"
id = "fa8c1b5913494faba25c936fc2156359"

[vars]
RELEASE_REPO = "Ahridan/TWB-Releases"

# GITHUB_TOKEN is a secret, never a var:
#   wrangler secret put GITHUB_TOKEN

# Match logs uploaded by the launcher and the game.
[[r2_buckets]]
binding = "LOGS"
bucket_name = "twb-logs"
